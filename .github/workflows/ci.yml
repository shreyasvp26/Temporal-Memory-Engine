name: CI

on:
  push:
    branches: [main, master, feat/*, release/*]
  pull_request:
    branches: [main, master]

jobs:
  fast-checks:
    name: Fast Checks (Lint, Types, Imports, Unit Tests)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Format check with ruff
        run: uv run ruff format --check .

      - name: Strict typecheck with mypy
        run: uv run mypy packages/memory_engine/src apps eval tests

      - name: Check hexagonal architecture import boundaries
        run: uv run lint-imports

      - name: Run unit tests (sockets disabled)
        run: uv run pytest tests/unit --disable-socket -m "not integration"

  integration-postgres:
    name: Postgres 16 + pgvector Integration Tests
    runs-on: ubuntu-latest
    needs: fast-checks
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: second_brain_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Postgres integration tests
        env:
          SB_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/second_brain_test
        run: uv run pytest tests/integration -m "integration"
