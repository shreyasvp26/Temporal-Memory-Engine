[project]
name = "second-brain"
version = "0.1.0"
description = "Bitemporal Personal Memory Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.5",
    "httpx>=0.27.2",
    "tenacity>=9.0.0",
    "dateparser>=1.2.0",
    "structlog>=24.4.0",
    "pyjwt[crypto]>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-socket>=0.7.0",
    "hypothesis>=6.112.0",
    "testcontainers[postgres]>=4.8.0",
    "vcrpy>=6.0.2",
    "ruff>=0.6.8",
    "mypy>=1.11.2",
    "import-linter>=2.1",
    "types-dateparser",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests requiring Docker Postgres (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "SLF001", "TCH"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "packages/memory_engine/src"
explicit_package_bases = true
namespace_packages = true

[tool.importlinter]
root_packages = ["memory_engine"]

[[tool.importlinter.contracts]]
name = "Domain is pure"
type = "forbidden"
source_modules = ["memory_engine.domain"]
forbidden_modules = [
    "memory_engine.ports",
    "memory_engine.db",
    "memory_engine.llm",
    "memory_engine.embed",
    "memory_engine.ingest",
    "memory_engine.retrieve",
    "memory_engine.lifecycle",
]

[[tool.importlinter.contracts]]
name = "Ports only depend on Domain"
type = "forbidden"
source_modules = ["memory_engine.ports"]
forbidden_modules = [
    "memory_engine.db",
    "memory_engine.llm",
    "memory_engine.embed",
    "memory_engine.ingest",
    "memory_engine.retrieve",
    "memory_engine.lifecycle",
]

[[tool.importlinter.contracts]]
name = "Application services do not import concrete adapters"
type = "forbidden"
source_modules = [
    "memory_engine.ingest",
    "memory_engine.retrieve",
    "memory_engine.lifecycle",
]
forbidden_modules = [
    "memory_engine.db",
    "memory_engine.llm",
    "memory_engine.embed",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages/memory_engine/src/memory_engine"]